<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mancala</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #1a0f00;
    --surface:   #2e1a00;
    --board:     #7a4a1e;
    --pit:       #5c3310;
    --pit-hover: #7a4a20;
    --store:     #4a2a0c;
    --gold:      #f0c040;
    --orange:    #e07030;
    --cream:     #fdf0d0;
    --muted:     #b09070;
    --valid:     #f0c040;
    --danger:    #e05030;
    --radius:    12px;
  }

  body {
    background: var(--bg);
    color: var(--cream);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 { font-size: 2.4rem; color: var(--gold); letter-spacing: 4px; text-transform: uppercase; }
  h2 { font-size: 1.4rem; color: var(--gold); margin-bottom: 12px; }
  h3 { font-size: 1rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }

  header {
    width: 100%;
    text-align: center;
    padding: 20px 0 10px;
    border-bottom: 1px solid #3a2000;
  }

  #app {
    width: 100%;
    max-width: 780px;
    padding: 20px 16px 40px;
  }

  /* ── Screens ── */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ── Cards ── */
  .card {
    background: var(--surface);
    border: 1px solid #4a2a00;
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }

  /* ── Inputs ── */
  input[type="text"] {
    width: 100%;
    background: #3a2000;
    border: 1px solid #5a3a10;
    border-radius: 8px;
    color: var(--cream);
    font-size: 1rem;
    padding: 10px 14px;
    margin-bottom: 14px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--gold); }
  input[type="text"]::placeholder { color: var(--muted); }

  /* ── Buttons ── */
  .btn {
    display: inline-block;
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s, transform 0.1s;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--orange); color: #fff; }
  .btn-secondary { background: #4a3010; color: var(--cream); }
  .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

  /* ── Mode toggle ── */
  .mode-toggle { display: flex; gap: 0; margin-bottom: 16px; border-radius: 8px; overflow: hidden; border: 1px solid #5a3a10; }
  .mode-btn {
    flex: 1; padding: 10px; border: none; background: #3a2000; color: var(--muted);
    font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  .mode-btn.active { background: var(--orange); color: #fff; }

  /* ── Difficulty select ── */
  select {
    width: 100%;
    background: #3a2000;
    border: 1px solid #5a3a10;
    border-radius: 8px;
    color: var(--cream);
    font-size: 1rem;
    padding: 10px 14px;
    margin-bottom: 14px;
    outline: none;
    cursor: pointer;
  }
  select:focus { border-color: var(--gold); }

  /* ── Room code ── */
  .room-code {
    font-size: 2.5rem;
    font-weight: 800;
    letter-spacing: 8px;
    color: var(--gold);
    text-align: center;
    padding: 16px;
    background: #3a2000;
    border-radius: 8px;
    margin: 12px 0;
    font-family: 'Courier New', monospace;
  }

  /* ── Error banner ── */
  #error-banner {
    display: none;
    background: #5a1010;
    border: 1px solid var(--danger);
    border-radius: 8px;
    color: #ffaaaa;
    padding: 10px 16px;
    margin-bottom: 12px;
    font-size: 0.95rem;
  }

  /* ── Game header ── */
  #game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid #3a2000;
    font-size: 0.85rem;
    color: var(--muted);
  }

  /* ── Board ── */
  #board-wrapper {
    background: var(--board);
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 8px 32px #0008;
    margin-bottom: 14px;
  }

  .player-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 8px;
    font-size: 0.9rem;
  }
  .player-bar .name { font-weight: 600; }
  .player-bar .score { color: var(--gold); font-weight: 700; font-size: 1.1rem; }
  .player-bar.active-player .name { color: var(--gold); }

  #board {
    display: grid;
    grid-template-columns: 64px 1fr 64px;
    gap: 8px;
    align-items: center;
    margin: 8px 0;
  }

  .store {
    background: var(--store);
    border-radius: 40px;
    height: 148px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    border: 2px solid #3a2000;
  }
  .store .stone-count {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--gold);
  }
  .store .store-label {
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  #pits-area {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .pit-row {
    display: flex;
    gap: 6px;
    justify-content: center;
  }

  .pit {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: var(--pit);
    border: 2px solid #3a2000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    user-select: none;
    transition: background 0.15s, border-color 0.15s, transform 0.1s, box-shadow 0.15s;
  }
  .pit .stone-count { font-size: 1.2rem; font-weight: 700; }
  .pit .pit-label { font-size: 0.6rem; color: var(--muted); }

  .pit.my-pit { cursor: pointer; }
  .pit.my-pit:hover { background: var(--pit-hover); }
  .pit.valid { border-color: var(--valid); box-shadow: 0 0 10px #f0c04066; }
  .pit.valid:hover { transform: scale(1.08); box-shadow: 0 0 18px #f0c040aa; }
  .pit.empty { opacity: 0.45; }
  .pit.disabled { cursor: default; opacity: 0.6; }
  .pit.last-moved { border-color: var(--orange); box-shadow: 0 0 10px #e0703066; }

  /* ── Status bar ── */
  #status-bar {
    text-align: center;
    padding: 10px;
    font-size: 1rem;
    font-weight: 600;
    color: var(--cream);
    background: var(--surface);
    border-radius: 8px;
    margin-bottom: 12px;
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #status-bar.your-turn { color: var(--gold); }

  /* ── Chat ── */
  #chat-area {
    background: var(--surface);
    border: 1px solid #4a2a00;
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 12px;
  }
  #chat-messages {
    height: 120px;
    overflow-y: auto;
    padding: 10px 14px;
    font-size: 0.88rem;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .chat-msg { color: var(--cream); }
  .chat-msg .chat-who { color: var(--orange); font-weight: 600; }
  .chat-msg.system { color: var(--muted); font-style: italic; }
  #chat-input-row {
    display: flex;
    border-top: 1px solid #4a2a00;
  }
  #chat-input {
    flex: 1;
    background: transparent;
    border: none;
    border-radius: 0;
    margin: 0;
    padding: 10px 14px;
    font-size: 0.9rem;
  }
  #chat-send {
    padding: 0 16px;
    background: var(--orange);
    border: none;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
  }
  #chat-send:hover { filter: brightness(1.15); }

  /* ── Game over overlay ── */
  #game-over-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #0009;
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #game-over-overlay.show { display: flex; }
  #game-over-box {
    background: var(--surface);
    border: 2px solid var(--gold);
    border-radius: 20px;
    padding: 36px 40px;
    text-align: center;
    max-width: 360px;
    width: 90%;
  }
  #game-over-title { font-size: 2rem; margin-bottom: 8px; }
  #game-over-scores { color: var(--muted); margin-bottom: 16px; font-size: 1.1rem; }

  /* ── Waiting spinner ── */
  .spinner {
    width: 36px; height: 36px;
    border: 4px solid #4a2a00;
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin: 12px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }

  @media (max-width: 500px) {
    .pit { width: 48px; height: 48px; }
    .pit .stone-count { font-size: 1rem; }
    .store { width: 50px; height: 120px; }
    .store .stone-count { font-size: 1.3rem; }
    #board { grid-template-columns: 52px 1fr 52px; }
  }
</style>
</head>
<body>

<header><h1>Mancala</h1></header>

<div id="app">

  <!-- ── LOBBY ── -->
  <div id="screen-lobby" class="screen active">
    <div class="card">
      <h2>Welcome</h2>
      <div id="error-banner"></div>
      <input type="text" id="name-input" placeholder="Your name" maxlength="20" autocomplete="off">

      <h3>How do you want to play?</h3>
      <div class="mode-toggle">
        <button class="mode-btn active" id="tab-create" onclick="showTab('create')">Create Room</button>
        <button class="mode-btn" id="tab-join" onclick="showTab('join')">Join Room</button>
      </div>

      <!-- Create panel -->
      <div id="panel-create">
        <h3>Game mode</h3>
        <div class="mode-toggle" style="margin-bottom:14px">
          <button class="mode-btn active" id="mode-pvp" onclick="selectMode('pvp')">vs Player</button>
          <button class="mode-btn" id="mode-ai" onclick="selectMode('ai')">vs AI</button>
        </div>
        <div id="difficulty-row" class="hidden">
          <h3>Difficulty</h3>
          <select id="difficulty-select">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="createRoom()">Create Game</button>
      </div>

      <!-- Join panel -->
      <div id="panel-join" class="hidden">
        <input type="text" id="room-code-input" placeholder="Room code (6 letters)" maxlength="6"
               autocomplete="off" style="text-transform:uppercase;letter-spacing:4px;font-size:1.2rem">
        <button class="btn btn-primary" onclick="joinRoom()">Join Game</button>
      </div>
    </div>
  </div>

  <!-- ── WAITING ── -->
  <div id="screen-waiting" class="screen">
    <div class="card" style="text-align:center">
      <h2>Room Created!</h2>
      <p style="color:var(--muted);margin-bottom:4px">Share this code with your opponent:</p>
      <div class="room-code" id="waiting-code">------</div>
      <button class="btn btn-secondary" style="margin-bottom:16px" onclick="copyCode()">Copy Code</button>
      <div class="spinner"></div>
      <p style="color:var(--muted);font-size:0.9rem">Waiting for opponent to join...</p>
    </div>
  </div>

  <!-- ── GAME ── -->
  <div id="screen-game" class="screen">
    <div id="game-header">
      <span id="gh-mode"></span>
      <span id="gh-room"></span>
    </div>

    <div id="board-wrapper">
      <div class="player-bar" id="opp-bar">
        <span class="name" id="opp-name">Opponent</span>
        <span class="score" id="opp-store-score">0</span>
      </div>

      <div id="board">
        <div class="store" id="opp-store-el">
          <span class="stone-count" id="opp-store-count">0</span>
          <span class="store-label">Store</span>
        </div>
        <div id="pits-area">
          <div class="pit-row" id="opp-pits"></div>
          <div class="pit-row" id="my-pits"></div>
        </div>
        <div class="store" id="my-store-el">
          <span class="stone-count" id="my-store-count">0</span>
          <span class="store-label">Store</span>
        </div>
      </div>

      <div class="player-bar" id="my-bar">
        <span class="name" id="my-name">You</span>
        <span class="score" id="my-store-score">0</span>
      </div>
    </div>

    <div id="status-bar">Connecting...</div>

    <div id="chat-area">
      <div id="chat-messages"></div>
      <div id="chat-input-row">
        <input type="text" id="chat-input" placeholder="Chat..." maxlength="200" autocomplete="off">
        <button id="chat-send">Send</button>
      </div>
    </div>
  </div>

</div>

<!-- ── GAME OVER OVERLAY ── -->
<div id="game-over-overlay">
  <div id="game-over-box">
    <h2 id="game-over-title">Game Over</h2>
    <p id="game-over-scores"></p>
    <button class="btn btn-primary" style="margin-top:16px" onclick="playAgain()">Play Again</button>
  </div>
</div>

<script>
const socket = io();

// ── App state ────────────────────────────────────────────────────────────────
const S = {
  playerId: null,
  mode: null,
  difficulty: null,
  roomId: null,
  myName: null,
  oppName: null,
  lastState: null,
  selectedMode: 'pvp',
};

// ── Pit index helpers ─────────────────────────────────────────────────────────
// My pits shown left-to-right (label 1..6 = board indices)
function myPitIndices() {
  return S.playerId === 0
    ? [0, 1, 2, 3, 4, 5]
    : [12, 11, 10, 9, 8, 7];
}
// Opp pits shown left-to-right (mirrored so they face each other)
function oppPitIndices() {
  return S.playerId === 0
    ? [12, 11, 10, 9, 8, 7]
    : [5, 4, 3, 2, 1, 0];
}
function myStoreIdx()  { return S.playerId === 0 ? 6 : 13; }
function oppStoreIdx() { return S.playerId === 0 ? 13 : 6; }

// Convert pit label 1-6 to board index
function labelToBoardIdx(label) {
  return S.playerId === 0 ? label - 1 : 13 - label;
}

// ── Screen management ─────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

function showTab(tab) {
  document.getElementById('tab-create').classList.toggle('active', tab === 'create');
  document.getElementById('tab-join').classList.toggle('active', tab === 'join');
  document.getElementById('panel-create').classList.toggle('hidden', tab !== 'create');
  document.getElementById('panel-join').classList.toggle('hidden', tab !== 'join');
  clearError();
}

function selectMode(mode) {
  S.selectedMode = mode;
  document.getElementById('mode-pvp').classList.toggle('active', mode === 'pvp');
  document.getElementById('mode-ai').classList.toggle('active', mode === 'ai');
  document.getElementById('difficulty-row').classList.toggle('hidden', mode !== 'ai');
}

function showError(msg) {
  const el = document.getElementById('error-banner');
  el.textContent = msg;
  el.style.display = 'block';
}
function clearError() {
  document.getElementById('error-banner').style.display = 'none';
}

// ── Lobby actions ─────────────────────────────────────────────────────────────
function getName() {
  return document.getElementById('name-input').value.trim() || 'Player';
}

function createRoom() {
  clearError();
  S.myName = getName();
  S.mode = S.selectedMode;
  S.difficulty = document.getElementById('difficulty-select').value;
  socket.emit('create_room', { name: S.myName, mode: S.mode, difficulty: S.difficulty });
}

function joinRoom() {
  clearError();
  const code = document.getElementById('room-code-input').value.trim().toUpperCase();
  if (code.length !== 6) { showError('Please enter the full 6-character room code.'); return; }
  S.myName = getName();
  socket.emit('join_room_request', { name: S.myName, room_id: code });
}

function copyCode() {
  navigator.clipboard.writeText(S.roomId).then(() => {
    const btn = document.querySelector('#screen-waiting .btn');
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  });
}

function playAgain() {
  document.getElementById('game-over-overlay').classList.remove('show');
  showScreen('lobby');
}

// ── Board setup ───────────────────────────────────────────────────────────────
function buildBoard() {
  const oppRow = document.getElementById('opp-pits');
  const myRow  = document.getElementById('my-pits');
  oppRow.innerHTML = '';
  myRow.innerHTML  = '';

  for (let i = 1; i <= 6; i++) {
    // Opponent pits (not clickable)
    const op = document.createElement('div');
    op.className = 'pit';
    op.id = `opp-pit-${i}`;
    op.innerHTML = `<span class="stone-count">0</span>`;
    oppRow.appendChild(op);

    // My pits (clickable)
    const mp = document.createElement('div');
    mp.className = 'pit my-pit';
    mp.id = `my-pit-${i}`;
    mp.dataset.label = i;
    mp.innerHTML = `<span class="stone-count">0</span><span class="pit-label">${i}</span>`;
    mp.addEventListener('click', () => onPitClick(i));
    myRow.appendChild(mp);
  }
}

// ── Render state ──────────────────────────────────────────────────────────────
function renderState(state) {
  S.lastState = state;
  const board = state.board;
  const myPits  = myPitIndices();
  const oppPits = oppPitIndices();
  const mySt    = myStoreIdx();
  const oppSt   = oppStoreIdx();

  // Stores
  document.getElementById('my-store-count').textContent  = board[mySt];
  document.getElementById('opp-store-count').textContent = board[oppSt];
  document.getElementById('my-store-score').textContent  = board[mySt];
  document.getElementById('opp-store-score').textContent = board[oppSt];

  const validSet = new Set(state.valid_moves);
  const lastPit  = state.last_move ? state.last_move.pit : null;
  const myTurn   = state.current_player === S.playerId;

  // My pits
  myPits.forEach((boardIdx, i) => {
    const el = document.getElementById(`my-pit-${i + 1}`);
    const count = board[boardIdx];
    el.querySelector('.stone-count').textContent = count;
    el.className = 'pit my-pit';
    if (count === 0) el.classList.add('empty');
    if (!myTurn || state.game_over) {
      el.classList.add('disabled');
    } else if (validSet.has(boardIdx)) {
      el.classList.add('valid');
    }
    if (boardIdx === lastPit) el.classList.add('last-moved');
  });

  // Opponent pits
  oppPits.forEach((boardIdx, i) => {
    const el = document.getElementById(`opp-pit-${i + 1}`);
    const count = board[boardIdx];
    el.querySelector('.stone-count').textContent = count;
    el.className = 'pit';
    if (count === 0) el.classList.add('empty');
    if (boardIdx === lastPit) el.classList.add('last-moved');
  });

  // Player bars — highlight active
  const myBar  = document.getElementById('my-bar');
  const oppBar = document.getElementById('opp-bar');
  myBar.classList.toggle('active-player',  myTurn && !state.game_over);
  oppBar.classList.toggle('active-player', !myTurn && !state.game_over);

  // Status
  const statusEl = document.getElementById('status-bar');
  if (!state.game_over) {
    if (myTurn) {
      const labels = state.valid_moves
        .map(idx => myPits.indexOf(idx) + 1)
        .filter(l => l > 0)
        .sort((a, b) => a - b);
      statusEl.textContent = `Your turn  —  pits: ${labels.join(', ')}`;
      statusEl.className = 'your-turn';
      if (state.last_move && state.last_move.extra_turn) {
        addChat('system', 'Extra turn!');
      }
    } else {
      const oppLabel = S.mode === 'ai' ? `AI (${S.difficulty})` : (S.oppName || 'Opponent');
      statusEl.textContent = `Waiting for ${oppLabel}...`;
      statusEl.className = '';
    }
  } else {
    statusEl.textContent = 'Game over';
    statusEl.className = '';
    showGameOver(state);
  }
}

function showGameOver(state) {
  const board = state.board;
  const myScore  = board[myStoreIdx()];
  const oppScore = board[oppStoreIdx()];
  const winner   = state.winner;

  let title, color;
  if (winner === null) {
    title = "It's a Tie!"; color = '#f0c040';
  } else if (winner === S.playerId) {
    title = 'You Win!'; color = '#50d080';
  } else {
    title = 'You Lose'; color = '#e05030';
  }

  const oppLabel = S.mode === 'ai' ? `AI` : (S.oppName || 'Opponent');
  document.getElementById('game-over-title').textContent = title;
  document.getElementById('game-over-title').style.color = color;
  document.getElementById('game-over-scores').textContent =
    `You: ${myScore}  |  ${oppLabel}: ${oppScore}`;
  document.getElementById('game-over-overlay').classList.add('show');
}

// ── Pit click ─────────────────────────────────────────────────────────────────
function onPitClick(label) {
  if (!S.lastState || S.lastState.game_over) return;
  if (S.lastState.current_player !== S.playerId) return;
  const boardIdx = labelToBoardIdx(label);
  if (!S.lastState.valid_moves.includes(boardIdx)) return;
  socket.emit('move', { pit: boardIdx });
}

// ── Chat ──────────────────────────────────────────────────────────────────────
function addChat(type, text, name) {
  const box = document.getElementById('chat-messages');
  const div = document.createElement('div');
  if (type === 'system') {
    div.className = 'chat-msg system';
    div.textContent = text;
  } else {
    div.className = 'chat-msg';
    div.innerHTML = `<span class="chat-who">${escHtml(name)}:</span> ${escHtml(text)}`;
  }
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('chat-send').addEventListener('click', sendChat);
document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendChat();
});
function sendChat() {
  const el = document.getElementById('chat-input');
  const text = el.value.trim();
  if (!text) return;
  socket.emit('chat', { text });
  el.value = '';
}

// ── Socket events ─────────────────────────────────────────────────────────────
socket.on('joined', data => {
  S.playerId   = data.player_id;
  S.mode       = data.mode;
  S.difficulty = data.difficulty || null;
  S.roomId     = data.room_id;
  S.oppName    = data.opponent || (data.mode === 'ai' ? `AI (${data.difficulty})` : 'Opponent');

  document.getElementById('my-name').textContent  = S.myName || 'You';
  document.getElementById('opp-name').textContent = S.oppName;
  document.getElementById('gh-room').textContent  = `Room: ${S.roomId}`;
  document.getElementById('gh-mode').textContent  =
    data.mode === 'ai' ? `vs AI (${data.difficulty})` : 'vs Player';

  buildBoard();

  if (data.mode === 'pvp' && !data.opponent) {
    // PvP creator — still waiting
  } else {
    showScreen('game');
    addChat('system', `Game started! You are Player ${S.playerId + 1}.`);
  }
});

socket.on('waiting', data => {
  S.roomId = data.room_id;
  document.getElementById('waiting-code').textContent = S.roomId;
  showScreen('waiting');
});

socket.on('state', state => {
  renderState(state);
});

socket.on('chat', data => {
  const name = data.from === S.playerId
    ? (S.myName || 'You')
    : (S.oppName || 'Opponent');
  addChat('msg', data.text, name);
});

socket.on('error', data => {
  if (document.getElementById('screen-lobby').classList.contains('active')) {
    showError(data.message);
  } else {
    addChat('system', `Error: ${data.message}`);
  }
});

socket.on('opponent_left', data => {
  addChat('system', data.message);
  document.getElementById('status-bar').textContent = 'Opponent disconnected.';
  document.getElementById('status-bar').className = '';
  if (S.lastState) {
    S.lastState.game_over = true;
  }
});

// ── Init ──────────────────────────────────────────────────────────────────────
document.getElementById('name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') createRoom();
});
document.getElementById('room-code-input').addEventListener('input', e => {
  e.target.value = e.target.value.toUpperCase();
});
</script>
</body>
</html>
