<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mancala</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #041c1c;
    --surface: #083030;
    --board:   #c4611a;
    --pit:     #7a2e08;
    --pit-h:   #9a3c0e;
    --store:   #5c2206;
    --gold:    #fecd1a;
    --teal:    #079494;
    --orange:  #c4611a;
    --rust:    #b6400f;
    --cream:   #fff9ee;
    --muted:   #5aacac;
    --danger:  #e03820;
    --radius:  14px;

    --pit-size:  min(62px, calc((100vw - 148px) / 6.4));
    --store-w:   min(64px, calc((100vw - 148px) / 8));
    --store-h:   calc(var(--pit-size) * 2.35);
    --pit-gap:   min(8px, calc((100vw - 148px) / 50));
    --pit-font:  calc(var(--pit-size) * 0.45);
    --store-font:calc(var(--pit-size) * 0.38);
  }

  body {
    background: radial-gradient(ellipse at top, #0a2828 0%, var(--bg) 70%);
    color: var(--cream);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    font-size: 2.6rem; letter-spacing: 8px; text-transform: uppercase; font-weight: 900;
    background: linear-gradient(135deg, var(--gold), #ffb800);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 0 16px rgba(254,205,26,0.4));
  }
  h2 { font-size: 1.4rem; color: var(--gold); margin-bottom: 12px; font-weight: 700; }
  h3 { font-size: .85rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }

  header {
    width: 100%; text-align: center; padding: 20px 0 14px;
    border-bottom: 2px solid var(--teal);
    background: linear-gradient(180deg, #021414 0%, transparent 100%);
  }

  #app { width: 100%; max-width: 780px; padding: 16px 14px 40px; }

  .screen { display: none; }
  .screen.active { display: block; }

  .card {
    background: var(--surface); border: 1px solid #0e4040;
    border-radius: var(--radius); padding: 24px; margin-bottom: 14px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }

  input[type="text"] {
    width: 100%; background: #052828; border: 1.5px solid var(--teal);
    border-radius: 8px; color: var(--cream); font-size: 1rem;
    padding: 10px 14px; margin-bottom: 14px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input[type="text"]:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(254,205,26,0.12); }
  input[type="text"]::placeholder { color: var(--muted); }

  select {
    width: 100%; background: #052828; border: 1.5px solid var(--teal);
    border-radius: 8px; color: var(--cream); font-size: 1rem;
    padding: 10px 14px; margin-bottom: 14px; outline: none; cursor: pointer;
    transition: border-color .2s;
  }
  select:focus { border-color: var(--gold); }

  .btn {
    display: inline-block; padding: 11px 26px; border: none; border-radius: 10px;
    font-size: 1rem; font-weight: 700; cursor: pointer; letter-spacing: .3px;
    transition: filter .15s, transform .1s, box-shadow .15s;
  }
  .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
  .btn:active { transform: scale(.97) translateY(0); filter: brightness(.95); }
  .btn-primary {
    background: linear-gradient(135deg, var(--orange) 0%, var(--rust) 100%);
    color: #fff; box-shadow: 0 4px 14px rgba(196,97,26,0.45);
  }
  .btn-secondary {
    background: var(--teal); color: #fff;
    box-shadow: 0 4px 14px rgba(7,148,148,0.35);
  }

  .toggle { display: flex; border-radius: 10px; overflow: hidden; border: 1.5px solid var(--teal); margin-bottom: 14px; }
  .toggle-btn { flex: 1; padding: 10px; border: none; background: #052828; color: var(--muted); font-size: .95rem; font-weight: 600; cursor: pointer; transition: background .15s, color .15s; }
  .toggle-btn.active { background: var(--teal); color: #fff; }

  #error-banner { display: none; background: #3a0e0e; border: 1px solid var(--danger); border-radius: 8px; color: #ffaaaa; padding: 10px 16px; margin-bottom: 12px; font-size: .95rem; }

  .room-code {
    font-size: 2.4rem; font-weight: 800; letter-spacing: 8px; color: var(--gold);
    text-align: center; padding: 14px; background: #052828; border-radius: 10px;
    margin: 10px 0; font-family: 'Courier New', monospace;
    border: 1.5px solid var(--teal);
    text-shadow: 0 0 12px rgba(254,205,26,0.35);
  }

  .spinner { width: 34px; height: 34px; border: 4px solid #083030; border-top-color: var(--teal); border-radius: 50%; animation: spin .8s linear infinite; margin: 14px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #game-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; padding-bottom: 10px;
    border-bottom: 1px solid #0e4040; font-size: .82rem; color: var(--muted);
  }

  #board-wrapper {
    background: linear-gradient(150deg, var(--orange) 0%, var(--rust) 100%);
    border-radius: 22px; padding: 14px 12px;
    box-shadow: 0 10px 40px rgba(182,64,15,0.4), 0 2px 8px rgba(0,0,0,0.6);
    margin-bottom: 12px;
    border: 1.5px solid rgba(254,205,26,0.18);
  }

  .player-bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; font-size: .88rem; }
  .player-bar .name { font-weight: 700; }
  .player-bar .score { color: var(--gold); font-weight: 800; font-size: 1.1rem; text-shadow: 0 0 10px rgba(254,205,26,0.5); }
  .player-bar.active-player .name { color: var(--gold); }
  .record { font-size: .73rem; color: rgba(255,249,238,0.55); font-weight: 400; margin-left: 5px; }

  #board { display: grid; grid-template-columns: var(--store-w) 1fr var(--store-w); gap: var(--pit-gap); align-items: center; margin: 6px 0; }

  .store {
    background: rgba(0,0,0,0.32);
    border-radius: 40px;
    width: var(--store-w); height: var(--store-h);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    border: 2px solid rgba(254,205,26,0.2);
    box-shadow: inset 0 3px 10px rgba(0,0,0,0.4);
  }
  .store .stone-count { font-size: var(--store-font); font-weight: 800; color: var(--gold); text-shadow: 0 0 10px rgba(254,205,26,0.6); }

  #pits-area { display: flex; flex-direction: column; gap: var(--pit-gap); }
  .pit-row { display: flex; gap: var(--pit-gap); justify-content: center; }

  .pit {
    width: var(--pit-size); height: var(--pit-size);
    border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, var(--pit-h), var(--pit));
    border: 2px solid rgba(0,0,0,0.35);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    user-select: none;
    transition: transform .12s, box-shadow .15s, border-color .15s;
    flex-shrink: 0;
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.45), 0 2px 4px rgba(0,0,0,0.3);
  }
  .pit .stone-count { font-size: var(--pit-font); font-weight: 800; line-height: 1; color: var(--cream); }

  .pit.my-pit { cursor: pointer; }
  .pit.my-pit:hover:not(.disabled) { transform: scale(1.06); box-shadow: inset 0 3px 8px rgba(0,0,0,0.35), 0 4px 10px rgba(0,0,0,0.35); }
  .pit.valid { border-color: var(--gold); box-shadow: inset 0 3px 8px rgba(0,0,0,0.35), 0 0 12px rgba(254,205,26,0.55); }
  .pit.valid:hover { transform: scale(1.1); box-shadow: inset 0 3px 8px rgba(0,0,0,0.25), 0 0 22px rgba(254,205,26,0.75); }
  .pit.empty { opacity: .38; }
  .pit.disabled { cursor: default; }
  .pit.last-moved { border-color: rgba(255,249,238,0.45); }

  .pit.landing {
    border-color: var(--gold);
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.25), 0 0 22px rgba(254,205,26,0.8);
    transform: scale(1.13);
  }
  .pit.capture-flash {
    border-color: var(--danger);
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.25), 0 0 22px rgba(224,56,32,0.8);
    transform: scale(1.1);
    background: radial-gradient(circle at 38% 35%, #8a2510, #5a1508);
  }

  #status-bar {
    text-align: center; padding: 10px; font-size: .95rem; font-weight: 600;
    color: var(--cream); background: var(--surface);
    border-radius: 10px; margin-bottom: 10px; min-height: 40px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #0e4040;
    transition: color .2s, border-color .2s, box-shadow .2s;
  }
  #status-bar.your-turn {
    color: var(--gold); border-color: rgba(254,205,26,0.3);
    box-shadow: 0 0 14px rgba(254,205,26,0.1);
  }

  #chat-area { background: var(--surface); border: 1px solid #0e4040; border-radius: var(--radius); overflow: hidden; margin-bottom: 10px; }
  #chat-messages { height: 100px; overflow-y: auto; padding: 8px 12px; font-size: .86rem; display: flex; flex-direction: column; gap: 3px; }
  .chat-msg { color: var(--cream); }
  .chat-msg .chat-who { color: var(--gold); font-weight: 600; }
  .chat-msg.system { color: var(--muted); font-style: italic; }
  #chat-input-row { display: flex; border-top: 1px solid #0e4040; }
  #chat-input { flex: 1; background: transparent; border: none; border-radius: 0; margin: 0; padding: 9px 12px; font-size: .88rem; color: var(--cream); outline: none; }
  #chat-send { padding: 0 16px; background: var(--teal); border: none; color: #fff; font-weight: 700; cursor: pointer; font-size: .88rem; transition: filter .15s; }
  #chat-send:hover { filter: brightness(1.15); }

  #game-over-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(4,28,28,0.82); backdrop-filter: blur(6px);
    z-index: 100; align-items: center; justify-content: center;
  }
  #game-over-overlay.show { display: flex; }
  #game-over-box {
    background: var(--surface); border: 2px solid var(--teal);
    border-radius: 22px; padding: 36px 40px; text-align: center; max-width: 340px; width: 90%;
    box-shadow: 0 24px 64px rgba(0,0,0,0.7), 0 0 40px rgba(7,148,148,0.2);
  }
  #game-over-title { font-size: 2rem; color: var(--gold); margin-bottom: 8px; font-weight: 800; letter-spacing: 1px; }
  #game-over-scores { color: var(--muted); font-size: 1.05rem; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header><h1>Mancala</h1></header>

<div id="app">

  <!-- ── LOBBY ── -->
  <div id="screen-lobby" class="screen active">
    <div class="card">
      <h2>Welcome</h2>
      <div id="error-banner"></div>
      <input type="text" id="name-input" placeholder="Your name" maxlength="20" autocomplete="off">

      <h3>How to play?</h3>
      <div class="toggle">
        <button class="toggle-btn active" id="tab-create" onclick="showTab('create')">Create Room</button>
        <button class="toggle-btn" id="tab-join"   onclick="showTab('join')">Join Room</button>
      </div>

      <div id="panel-create">
        <h3>Mode</h3>
        <div class="toggle">
          <button class="toggle-btn active" id="mode-pvp" onclick="selectMode('pvp')">vs Player</button>
          <button class="toggle-btn"        id="mode-ai"  onclick="selectMode('ai')">vs AI</button>
        </div>
        <div id="difficulty-row" class="hidden">
          <h3>Difficulty</h3>
          <select id="difficulty-select">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <h3>First Move</h3>
        <select id="first-move-select">
          <option value="0">You go first</option>
          <option id="first-move-opp" value="1">Opponent goes first</option>
          <option value="random">Random</option>
        </select>
        <button class="btn btn-primary" onclick="createRoom()">Create Game</button>
      </div>

      <div id="panel-join" class="hidden">
        <input type="text" id="room-code-input" placeholder="Room code (6 chars)" maxlength="6"
               autocomplete="off" style="text-transform:uppercase;letter-spacing:4px;font-size:1.15rem">
        <button class="btn btn-primary" onclick="joinRoom()">Join Game</button>
      </div>
    </div>
  </div>

  <!-- ── WAITING ── -->
  <div id="screen-waiting" class="screen">
    <div class="card" style="text-align:center">
      <h2>Room Created!</h2>
      <p style="color:var(--muted);margin-bottom:4px">Share this code with your opponent:</p>
      <div class="room-code" id="waiting-code">------</div>
      <button class="btn btn-secondary" style="margin-bottom:14px" onclick="copyCode()">Copy Code</button>
      <div class="spinner"></div>
      <p style="color:var(--muted);font-size:.9rem">Waiting for opponent...</p>
    </div>
  </div>

  <!-- ── GAME ── -->
  <div id="screen-game" class="screen">
    <div id="game-header">
      <span id="gh-mode"></span>
      <span id="gh-room"></span>
      <button class="btn btn-secondary" style="font-size:.75rem;padding:4px 12px" onclick="goToMainMenu()">Main Menu</button>
    </div>

    <div id="board-wrapper">
      <div class="player-bar" id="opp-bar">
        <span class="name" id="opp-name"><span id="opp-name-text">Opponent</span> <span class="record" id="opp-record"></span></span>
        <span class="score" id="opp-score">0</span>
      </div>
      <div id="board">
        <div class="store" id="opp-store-el">
          <span class="stone-count" id="opp-store-count">0</span>
        </div>
        <div id="pits-area">
          <div class="pit-row" id="opp-pits"></div>
          <div class="pit-row" id="my-pits"></div>
        </div>
        <div class="store" id="my-store-el">
          <span class="stone-count" id="my-store-count">0</span>
        </div>
      </div>
      <div class="player-bar" id="my-bar">
        <span class="name" id="my-name"><span id="my-name-text">You</span> <span class="record" id="my-record"></span></span>
        <span class="score" id="my-score">0</span>
      </div>
    </div>

    <div id="status-bar">Connecting...</div>

    <div id="chat-area">
      <div id="chat-messages"></div>
      <div id="chat-input-row">
        <input type="text" id="chat-input" placeholder="Chat..." maxlength="200" autocomplete="off">
        <button id="chat-send">Send</button>
      </div>
    </div>
  </div>

</div>

<!-- Game over overlay -->
<div id="game-over-overlay">
  <div id="game-over-box">
    <div id="game-over-title">Game Over</div>
    <div id="game-over-scores"></div>
    <div id="game-over-record" style="color:var(--gold);font-size:.95rem;margin-top:8px"></div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:18px">
      <button class="btn btn-primary" onclick="requestRematch()">Rematch</button>
      <button class="btn btn-secondary" onclick="goToMainMenu()">Main Menu</button>
    </div>
  </div>
</div>

<script>
const socket = io();
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ── Constants (mirror server) ──────────────────────────────────────────────
const P1_PITS  = [0,1,2,3,4,5];
const P1_STORE = 6;
const P2_PITS  = [7,8,9,10,11,12];
const P2_STORE = 13;
const OPPOSITE = {0:12,1:11,2:10,3:9,4:8,5:7, 7:5,8:4,9:3,10:2,11:1,12:0};
const PLAYER_PITS  = {0: P1_PITS,  1: P2_PITS};
const PLAYER_STORE = {0: P1_STORE, 1: P2_STORE};

// ── App state ──────────────────────────────────────────────────────────────
const S = {
  playerId: null, mode: null, difficulty: null,
  roomId: null, myName: null, oppName: null,
  selectedMode: 'pvp',
};
let prevBoard          = null;
let isAnimating        = false;
let animQueue          = [];
let latestStateSeq     = 0;
let lastGameSummarized = -1;
let animationVersion   = 0;

// ── Pit index helpers ──────────────────────────────────────────────────────
function myPitIndices()  {
  return S.playerId === 0 ? [0,1,2,3,4,5] : [7,8,9,10,11,12];
}
function oppPitIndices() {
  return S.playerId === 0 ? [12,11,10,9,8,7] : [5,4,3,2,1,0];
}
function myStoreIdx()  { return S.playerId === 0 ? P1_STORE : P2_STORE; }
function oppStoreIdx() { return S.playerId === 0 ? P2_STORE : P1_STORE; }

function labelToBoardIdx(label) {
  return S.playerId === 0 ? label - 1 : label + 6;
}

// ── DOM helpers ────────────────────────────────────────────────────────────
// Returns the pit DOM element for a given board index, or null
function pitEl(boardIdx) {
  const mp = myPitIndices(), op = oppPitIndices();
  const mi = mp.indexOf(boardIdx);
  if (mi !== -1) return document.getElementById(`my-pit-${mi+1}`);
  const oi = op.indexOf(boardIdx);
  if (oi !== -1) return document.getElementById(`opp-pit-${oi+1}`);
  return null;
}

function cancelAnimations() {
  animationVersion++;
  isAnimating = false;
  animQueue = [];
}

// ── Screen management ──────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}
function showTab(tab) {
  ['create','join'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
    document.getElementById('panel-'+t).classList.toggle('hidden', t!==tab);
  });
  clearError();
}
function selectMode(m) {
  S.selectedMode = m;
  document.getElementById('mode-pvp').classList.toggle('active', m==='pvp');
  document.getElementById('mode-ai').classList.toggle('active',  m==='ai');
  document.getElementById('difficulty-row').classList.toggle('hidden', m!=='ai');
  document.getElementById('first-move-opp').textContent =
    m === 'ai' ? 'AI goes first' : 'Opponent goes first';
}
function showError(msg) {
  const el = document.getElementById('error-banner');
  el.textContent = msg; el.style.display = 'block';
}
function clearError() { document.getElementById('error-banner').style.display = 'none'; }

// ── Lobby actions ──────────────────────────────────────────────────────────
function getName() { return document.getElementById('name-input').value.trim() || 'Player'; }

function createRoom() {
  clearError();
  S.myName = getName();
  S.mode = S.selectedMode;
  S.difficulty = document.getElementById('difficulty-select').value;
  const firstPlayer = document.getElementById('first-move-select').value;
  socket.emit('create_room', { name: S.myName, mode: S.mode, difficulty: S.difficulty, first_player: firstPlayer });
}
function joinRoom() {
  clearError();
  const code = document.getElementById('room-code-input').value.trim().toUpperCase();
  if (code.length !== 6) { showError('Enter the full 6-character room code.'); return; }
  S.myName = getName();
  socket.emit('join_room_request', { name: S.myName, room_id: code });
}
function copyCode() {
  navigator.clipboard.writeText(S.roomId).then(() => {
    const btn = document.querySelector('#screen-waiting .btn');
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}
function goToMainMenu() {
  cancelAnimations();
  document.getElementById('game-over-overlay').classList.remove('show');
  showScreen('lobby');
}

// ── Board setup ────────────────────────────────────────────────────────────
function buildBoard() {
  ['opp-pits','my-pits'].forEach(id => document.getElementById(id).innerHTML = '');

  for (let i = 1; i <= 6; i++) {
    const op = document.createElement('div');
    op.className = 'pit'; op.id = `opp-pit-${i}`;
    op.innerHTML = `<span class="stone-count">0</span>`;
    document.getElementById('opp-pits').appendChild(op);

    const mp = document.createElement('div');
    mp.className = 'pit my-pit'; mp.id = `my-pit-${i}`;
    mp.dataset.label = i;
    mp.innerHTML = `<span class="stone-count">0</span>`;
    mp.addEventListener('click', () => onPitClick(i));
    document.getElementById('my-pits').appendChild(mp);
  }
}

// ── Render board only (no status/etc.) ────────────────────────────────────
function applyBoard(board, validSet, lastPit) {
  const myPits  = myPitIndices();
  const oppPits = oppPitIndices();

  myPits.forEach((bi, i) => {
    const el = document.getElementById(`my-pit-${i+1}`);
    el.querySelector('.stone-count').textContent = board[bi];
    el.className = 'pit my-pit';
    if (board[bi] === 0) el.classList.add('empty');
    if (validSet && validSet.has(bi)) el.classList.add('valid');
    else if (!validSet) el.classList.add('disabled');
    if (bi === lastPit) el.classList.add('last-moved');
  });

  oppPits.forEach((bi, i) => {
    const el = document.getElementById(`opp-pit-${i+1}`);
    el.querySelector('.stone-count').textContent = board[bi];
    el.className = 'pit';
    if (board[bi] === 0) el.classList.add('empty');
    if (bi === lastPit) el.classList.add('last-moved');
  });

  document.getElementById('my-store-count').textContent  = board[myStoreIdx()];
  document.getElementById('opp-store-count').textContent = board[oppStoreIdx()];
  document.getElementById('my-score').textContent        = board[myStoreIdx()];
  document.getElementById('opp-score').textContent       = board[oppStoreIdx()];
}

// ── Full render (board + status) ───────────────────────────────────────────
function renderState(state) {
  const myTurn   = state.current_player === S.playerId;
  const validSet = myTurn && !state.game_over ? new Set(state.valid_moves) : null;
  const lastPit  = state.last_move ? state.last_move.pit : null;

  applyBoard(state.board, validSet, lastPit);

  const scores = state.scores || {0: 0, 1: 0};
  const gp = state.games_played || 0;
  if (gp >= 1) {
    const myW  = scores[S.playerId]     || 0;
    const oppW = scores[1 - S.playerId] || 0;
    document.getElementById('my-record').textContent  = `${myW}W–${oppW}L`;
    document.getElementById('opp-record').textContent = `${oppW}W–${myW}L`;
  }

  document.getElementById('my-bar').classList.toggle('active-player',  myTurn && !state.game_over);
  document.getElementById('opp-bar').classList.toggle('active-player', !myTurn && !state.game_over);

  const statusEl = document.getElementById('status-bar');
  if (state.game_over) {
    statusEl.textContent = 'Game over';
    statusEl.className = '';
    showGameOver(state);
  } else {
    if (myTurn) {
      statusEl.textContent = 'Your turn';
      statusEl.className = 'your-turn';
    } else {
      const opp = S.mode === 'ai' ? `AI (${S.difficulty})` : (S.oppName || 'Opponent');
      statusEl.textContent = `Waiting for ${opp}...`;
      statusEl.className = '';
    }
    document.getElementById('game-over-overlay').classList.remove('show');
  }
}

function showGameOver(state) {
  const myS  = state.board[myStoreIdx()];
  const oppS = state.board[oppStoreIdx()];
  const w    = state.winner;
  let title, color;
  if (w === null)           { title = "It's a Tie!"; color = '#f0c040'; }
  else if (w === S.playerId){ title = 'You Win!';    color = '#50d080'; }
  else                      { title = 'You Lose';    color = '#e05030'; }
  const opp = S.mode === 'ai' ? 'AI' : (S.oppName || 'Opponent');
  document.getElementById('game-over-title').textContent = title;
  document.getElementById('game-over-title').style.color = color;
  document.getElementById('game-over-scores').textContent = `You: ${myS}  |  ${opp}: ${oppS}`;

  const scores = state.scores || {0: 0, 1: 0};
  const gp = state.games_played || 0;
  const recEl = document.getElementById('game-over-record');
  if (gp >= 1) {
    const myW  = scores[S.playerId]  || 0;
    const oppW = scores[1 - S.playerId] || 0;
    recEl.textContent = `Series: ${myW} – ${oppW}`;
  } else {
    recEl.textContent = '';
  }

  document.getElementById('game-over-overlay').classList.add('show');

  // Post summary to chat once per completed game
  if (gp !== lastGameSummarized) {
    lastGameSummarized = gp;
    const myS   = state.board[myStoreIdx()];
    const oppS  = state.board[oppStoreIdx()];
    const opp   = S.mode === 'ai' ? 'AI' : (S.oppName || 'Opponent');
    const myW   = scores[S.playerId]      || 0;
    const oppW  = scores[1 - S.playerId]  || 0;
    let result  = w === null ? 'Tie' : (w === S.playerId ? 'You win!' : 'You lose');
    let summary = `Game ${gp}: You ${myS} – ${opp} ${oppS} | ${result}`;
    if (gp >= 1) summary += ` | Series ${myW}–${oppW}`;
    addChat('system', summary);
  }
}

function requestRematch() {
  document.getElementById('game-over-overlay').classList.remove('show');
  socket.emit('rematch');
}

// ── Pit click ──────────────────────────────────────────────────────────────
function onPitClick(label) {
  if (isAnimating) return;
  socket.emit('move', { pit: labelToBoardIdx(label) });
}

// ── Animation ─────────────────────────────────────────────────────────────
// Compute the ordered list of board indices that receive a stone during a move
function distributionPath(board, player, pit) {
  const oppStore = player === 0 ? P2_STORE : P1_STORE;
  let stones = board[pit];
  let idx = pit;
  const path = [];
  for (let i = 0; i < stones; i++) {
    idx = (idx + 1) % 14;
    if (idx === oppStore) idx = (idx + 1) % 14;
    path.push(idx);
  }
  return path;
}

async function animateMove(boardBefore, lastMove, finalState) {
  const version = animationVersion;
  const { player, pit, captured } = lastMove;
  const isStillCurrentAnimation = () => version === animationVersion;

  const board = [...boardBefore];
  const path  = distributionPath(board, player, pit);

  // Empty the source pit
  board[pit] = 0;
  applyBoard(board, null, null);
  await sleep(200);
  if (!isStillCurrentAnimation()) return;

  // Drop one stone at a time
  for (const dest of path) {
    board[dest]++;
    applyBoard(board, null, dest);

    const el = pitEl(dest);
    if (el) {
      el.classList.add('landing');
      await sleep(300);
      el.classList.remove('landing');
    } else {
      const storeEl = dest === myStoreIdx()
        ? document.getElementById('my-store-el')
        : document.getElementById('opp-store-el');
      storeEl.style.borderColor = 'var(--gold)';
      await sleep(300);
      storeEl.style.borderColor = '';
    }
    if (!isStillCurrentAnimation()) return;
  }

  // If a capture happened, flash both pits then clear them
  if (captured) {
    const lastDest  = path[path.length - 1];
    const opp       = OPPOSITE[lastDest];
    await sleep(250);
    const captureEls = [pitEl(lastDest), pitEl(opp)].filter(Boolean);
    captureEls.forEach(el => el.classList.add('capture-flash'));
    await sleep(500);
    captureEls.forEach(el => el.classList.remove('capture-flash'));
    if (!isStillCurrentAnimation()) return;
  }

  await sleep(150);
  if (!isStillCurrentAnimation()) return;
  renderState(finalState);

  if (animQueue.length > 0) {
    const next = animQueue.shift();
    animateMove(next.boardBefore, next.lastMove, next.finalState);
  } else {
    isAnimating = false;
  }
}

// ── Chat ───────────────────────────────────────────────────────────────────
function addChat(type, text, name) {
  const box = document.getElementById('chat-messages');
  const div = document.createElement('div');
  if (type === 'system') {
    div.className = 'chat-msg system';
    div.textContent = text;
  } else {
    div.className = 'chat-msg';
    div.innerHTML = `<span class="chat-who">${escHtml(name)}:</span> ${escHtml(text)}`;
  }
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
document.getElementById('chat-send').addEventListener('click', sendChat);
document.getElementById('chat-input').addEventListener('keydown', e => { if(e.key==='Enter') sendChat(); });
function sendChat() {
  const el = document.getElementById('chat-input');
  const text = el.value.trim();
  if (!text) return;
  socket.emit('chat', { text });
  el.value = '';
}

// ── Socket events ──────────────────────────────────────────────────────────
socket.on('joined', data => {
  S.playerId   = data.player_id;
  S.mode       = data.mode;
  S.difficulty = data.difficulty || null;
  S.roomId     = data.room_id;
  S.oppName    = data.opponent || (data.mode === 'ai' ? `AI (${data.difficulty})` : 'Opponent');

  // Reset state for new game/room
  prevBoard          = null;
  latestStateSeq     = 0;
  cancelAnimations();
  lastGameSummarized = -1;
  document.getElementById('my-record').textContent  = '';
  document.getElementById('opp-record').textContent = '';
  document.getElementById('chat-messages').innerHTML = '';

  document.getElementById('my-name-text').textContent  = S.myName || 'You';
  document.getElementById('opp-name-text').textContent = S.oppName;
  document.getElementById('gh-room').textContent  = `Room: ${S.roomId}`;
  document.getElementById('gh-mode').textContent  =
    data.mode === 'ai' ? `vs AI (${data.difficulty})` : `vs ${S.oppName}`;

  // Show chat input only in PvP
  document.getElementById('chat-input-row').style.display = data.mode === 'ai' ? 'none' : 'flex';

  buildBoard();
  if (data.mode !== 'pvp' || data.opponent) {
    showScreen('game');
    const fp = data.first_player;
    const whoFirst = fp === S.playerId ? 'You go first'
      : (data.mode === 'ai' ? 'AI goes first' : `${S.oppName} goes first`);
    addChat('system', `Game started. ${whoFirst}.`);
  }
});

socket.on('waiting', data => {
  S.roomId = data.room_id;
  document.getElementById('waiting-code').textContent = S.roomId;
  showScreen('waiting');
});

function onGameScreen() {
  return document.getElementById('screen-game').classList.contains('active');
}

socket.on('new_game', data => {
  if (!onGameScreen()) return;
  cancelAnimations();
  prevBoard = null;
  document.getElementById('game-over-overlay').classList.remove('show');
  const fp = data.first_player;
  const whoFirst = fp === S.playerId ? 'You go first'
    : (S.mode === 'ai' ? 'AI goes first' : `${S.oppName || 'Opponent'} goes first`);
  addChat('system', `Rematch! ${whoFirst}.`);
});

socket.on('state', state => {
  if (!onGameScreen()) return;
  if (typeof state.state_seq === 'number') {
    if (state.state_seq <= latestStateSeq) return;
    latestStateSeq = state.state_seq;
  }

  const boardSnapshot = prevBoard;
  prevBoard = state.board;

  if (state.game_over) {
    document.getElementById('status-bar').textContent = 'Game over';
    document.getElementById('status-bar').className = '';
    showGameOver(state);
  }

  if (boardSnapshot && state.last_move) {
    const item = { boardBefore: boardSnapshot, lastMove: state.last_move, finalState: state };
    if (isAnimating) animQueue.push(item);
    else { isAnimating = true; animateMove(item.boardBefore, item.lastMove, item.finalState); }
  } else {
    if (!isAnimating) renderState(state);
  }
});

socket.on('chat', data => {
  const name = data.from === S.playerId ? (S.myName || 'You') : (S.oppName || 'Opponent');
  addChat('msg', data.text, name);
});

socket.on('error', data => {
  if (document.getElementById('screen-lobby').classList.contains('active'))
    showError(data.message);
  else
    addChat('system', `Error: ${data.message}`);
});

socket.on('opponent_left', data => {
  addChat('system', data.message);
  document.getElementById('status-bar').textContent = 'Opponent disconnected.';
  document.getElementById('status-bar').className = '';
});

// ── Init ───────────────────────────────────────────────────────────────────
document.getElementById('name-input').addEventListener('keydown', e => { if(e.key==='Enter') createRoom(); });
document.getElementById('room-code-input').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase(); });
</script>
